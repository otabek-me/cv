{% extends 'base.html' %}
{% block content%}
    <h3>Ism familiya:{{ profile.get_full_name }}</h3>
        
    {% if user.is_premium %}
        <h3>Premium user</h3>
        <p>{{ user.requests }} ta bugungi so'rov</p>
        <p>{{ user.limit_date }} gacha obuna</p>
        <p>{{ user.limit_requests }} ta limit qoldi</p>
    {% else %}
        <a href="{% url 'get-premium' %}">Premium olish</a>
    {% endif %}
{% endblock%}
